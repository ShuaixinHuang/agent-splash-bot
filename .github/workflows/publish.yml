name: Publish verified tag
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag with a successful three-platform CI run'
        required: true
        default: 'v0.2.0'
      refresh:
        description: 'Replace packages of an existing public release'
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      REFRESH_RELEASE: ${{ inputs.refresh }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require successful checks for this exact commit
        run: |
          export RELEASE_SHA="$(git rev-parse HEAD)"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$RELEASE_SHA&status=success" > /tmp/verified-runs.json
          python - <<'PY'
          import json, os, tomllib
          data = json.load(open('/tmp/verified-runs.json'))
          assert any(run['head_sha'] == os.environ['RELEASE_SHA'] and run['conclusion'] == 'success' for run in data['workflow_runs']), 'No successful three-platform CI for this commit'
          with open('pyproject.toml', 'rb') as stream:
              version = tomllib.load(stream)['project']['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag does not match package version'
          PY
      - run: python -m pip install build
      - run: python -m build
      - run: python tests/check_packages.py
      - name: Upload verified packages, then publish
        run: |
          set -euo pipefail
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS)
          if gh release view "$RELEASE_TAG" --json isDraft > /tmp/release.json; then
            python -c "import json,os; assert json.load(open('/tmp/release.json'))['isDraft'] or os.environ['REFRESH_RELEASE'] == 'true', 'Explicit refresh is required for a public release'"
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "Aurora Boot $RELEASE_TAG" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" dist/*.whl dist/*.tar.gz dist/SHA256SUMS --clobber
          gh release view "$RELEASE_TAG" --json assets > /tmp/assets.json
          python - <<'PY'
          import json
          names = {item['name'] for item in json.load(open('/tmp/assets.json'))['assets']}
          assert 'SHA256SUMS' in names and any(name.endswith('.whl') for name in names) and any(name.endswith('.tar.gz') for name in names)
          PY
          gh release edit "$RELEASE_TAG" --draft=false --latest
