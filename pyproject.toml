[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aurora-boot"
version = "0.2.0"
description = "Procedural desktop intro animations for Windows, macOS and Linux X11"
readme = "README.md"
requires-python = ">=3.10"
license = "Unlicense"
license-files = ["LICENSE", "DEPENDENCIES.md"]
dependencies = [
  "PySide6==6.8.3",
  "python-xlib==0.33; sys_platform == 'linux'",
  "pyobjc-framework-Cocoa>=10,<13; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=10,<13; sys_platform == 'darwin'",
]

[project.scripts]
aurora-boot = "aurora_boot.app:main"

[project.urls]
Repository = "https://github.com/ShuaixinHuang/agent-splash-bot"
Issues = "https://github.com/ShuaixinHuang/agent-splash-bot/issues"

[tool.setuptools.packages.find]
where = ["src"]
